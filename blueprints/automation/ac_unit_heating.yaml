blueprint:
  name: AC unit heating
  description: >-
    During the heating season (1 October to 31 March), hold the room at its
    target temperature by stepping the AC unit's setpoint up or down by 1 °C,
    using a room temperature sensor. The unit stays in heat mode and is never
    turned off. During the night setback, the unoccupied target applies even
    when the room is occupied. A manually selected mode other than heat holds
    until the next night setback boundary, then heating resumes.
  domain: automation
  min_version: 2026.10.2
  input:
    climate_entity:
      name: AC unit
      description: Climate entity of the AC unit to control.
      selector:
        entity:
          filter:
            - domain: climate
    temperature_sensor:
      name: Room temperature sensor
      description: Room temperature used to decide the setpoint.
      selector:
        entity:
          filter:
            - domain: sensor
    occupancy_entity:
      name: Occupancy entity
      description: On while the room is occupied.
      selector:
        entity:
          filter:
            - domain:
                - input_boolean
                - binary_sensor
    unoccupied_target_temp:
      name: Unoccupied target temperature
      description:
        Target temperature while the room is unoccupied. Also applies during the
        night setback.
      default: 16
      selector:
        number:
          min: 15
          max: 18
          step: 0.5
          unit_of_measurement: °C
    occupied_target_temp:
      name: Occupied target temperature
      description: Target temperature while the room is occupied.
      default: 22
      selector:
        number:
          min: 19
          max: 23
          step: 0.5
          unit_of_measurement: °C
    night_setback_start:
      name: Night setback start
      description:
        Time the night setback starts. Manual overrides are cleared from this
        time.
      default: "00:00:00"
      selector:
        time: {}
    night_setback_end:
      name: Night setback end
      description:
        Time the night setback ends. Manual overrides are cleared from this
        time.
      default: "07:00:00"
      selector:
        time: {}

triggers:
  - trigger: time_pattern
    minutes: "/15"
  - trigger: time
    at: !input night_setback_start
    id: boundary
  - trigger: time
    at: !input night_setback_end
    id: boundary
  - trigger: time
    at: "00:00:00"
    id: season_start
  - trigger: homeassistant
    event: start

actions:
  - variables:
      climate_entity: !input climate_entity
      temperature_sensor: !input temperature_sensor
      occupancy_entity: !input occupancy_entity
      unoccupied_target_temp: !input unoccupied_target_temp
      occupied_target_temp: !input occupied_target_temp
      night_setback_start: !input night_setback_start
      night_setback_end: !input night_setback_end
      deadband: 0.5
      setpoint_min: 17
      setpoint_max: 25
      stale_after_seconds: 3600
      target_temp: >-
        {% set now_time = now().strftime('%H:%M:%S') %} {% set in_night_setback
        = (night_setback_start <= now_time < night_setback_end) if
        night_setback_start < night_setback_end else (now_time >=
        night_setback_start or now_time < night_setback_end) %} {{
        unoccupied_target_temp if in_night_setback or not
        is_state(occupancy_entity, 'on') else occupied_target_temp }}
      current_setpoint: >-
        {{ state_attr(climate_entity, 'temperature') | float
           if is_number(state_attr(climate_entity, 'temperature'))
           else target_temp | float }}
      fallback_setpoint: >-
        {{ [[unoccupied_target_temp | float, setpoint_min] | max, setpoint_max]
        | min }}

  # The heating season is hard-coded to 1 October to 31 March.
  - if:
      - condition: template
        value_template: "{{ now().month not in [10, 11, 12, 1, 2, 3] }}"
    then:
      - stop: "Outside the heating season: AC unit is left alone."

  # A manual mode holds until the next night setback boundary.
  - if:
      - condition: template
        value_template: "{{ not is_state(climate_entity, 'heat') }}"
      - condition: template
        value_template: >-
          {{ not (trigger.id == 'boundary' or
                  (trigger.id == 'season_start' and now().month == 10 and
          now().day == 1)) }}
    then:
      - stop: "Manual override holds until the next night setback boundary."

  - if:
      - condition: template
        value_template: "{{ not is_state(climate_entity, 'heat') }}"
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input climate_entity
        data:
          hvac_mode: heat

  # Without a fresh room reading, use the unit's own sensor at the unoccupied target, with no correction.
  - if:
      - condition: template
        value_template: >-
          {{ not is_number(states(temperature_sensor))
             or (now() -
          states[temperature_sensor].last_reported).total_seconds()
                > stale_after_seconds }}
    then:
      - if:
          - condition: template
            value_template:
              "{{ current_setpoint | float != fallback_setpoint | float }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ fallback_setpoint }}"
      - stop:
          "Room temperature is unavailable or stale: fell back to the unoccupied
          target."

  # Step the setpoint toward the target by 1 °C. Never turn the unit off.
  - variables:
      new_setpoint: >-
        {% set room = states(temperature_sensor) | float %} {% set step = 1 if
        room < target_temp | float - deadband else -1 if room > target_temp |
        float + deadband else 0 %} {{ [[current_setpoint | float + step,
        setpoint_min] | max, setpoint_max] | min }}

  - if:
      - condition: template
        value_template: "{{ new_setpoint | float != current_setpoint | float }}"
    then:
      - action: climate.set_temperature
        target:
          entity_id: !input climate_entity
        data:
          temperature: "{{ new_setpoint }}"

mode: restart
