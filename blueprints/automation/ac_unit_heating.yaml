blueprint:
  name: AC unit heating
  description: >-
    During the heating season (1 October to 31 March), hold the room at its
    target temperature by stepping the AC unit's setpoint up or down by 1 °C,
    using a room temperature sensor. The target is the occupied or unoccupied
    target, depending on the occupancy entity. The unit stays in heat mode and
    is never turned off. A manually selected mode other than heat holds until
    occupancy changes or the heating season starts, then heating resumes.
  domain: automation
  min_version: 2026.10.2
  input:
    climate_entity:
      name: AC unit
      description: Climate entity of the AC unit to control.
      selector:
        entity:
          filter:
            - domain: climate
    temperature_sensor:
      name: Room temperature sensor
      description: Room temperature used to decide the setpoint.
      selector:
        entity:
          filter:
            - domain: sensor
    occupancy_entity:
      name: Occupancy entity
      description: On while the room is occupied.
      selector:
        entity:
          filter:
            - domain:
                - input_boolean
                - binary_sensor
    unoccupied_target_temp:
      name: Unoccupied target temperature
      description: Target temperature while the room is unoccupied.
      default: 16
      selector:
        number:
          min: 15
          max: 18
          step: 0.5
          unit_of_measurement: °C
    occupied_target_temp:
      name: Occupied target temperature
      description: Target temperature while the room is occupied.
      default: 22
      selector:
        number:
          min: 19
          max: 23
          step: 0.5
          unit_of_measurement: °C

triggers:
  - trigger: time_pattern
    minutes: "/15"
  - trigger: state
    entity_id: !input occupancy_entity
    id: occupancy_change
  - trigger: time
    at: "00:00:00"
    id: season_start
  - trigger: homeassistant
    event: start

actions:
  - variables:
      climate_entity: !input climate_entity
      temperature_sensor: !input temperature_sensor
      occupancy_entity: !input occupancy_entity
      unoccupied_target_temp: !input unoccupied_target_temp
      occupied_target_temp: !input occupied_target_temp
      deadband: 0.5
      setpoint_min: 17
      setpoint_max: 25
      stale_after_seconds: 3600
      target_temp: >-
        {{ occupied_target_temp if is_state(occupancy_entity, 'on')
           else unoccupied_target_temp }}
      current_setpoint: >-
        {{ state_attr(climate_entity, 'temperature') | float
           if is_number(state_attr(climate_entity, 'temperature'))
           else target_temp | float }}
      fallback_setpoint: >-
        {{ [[unoccupied_target_temp | float, setpoint_min] | max, setpoint_max]
        | min }}

  # The heating season is hard-coded to 1 October to 31 March.
  - if:
      - condition: template
        value_template: "{{ now().month not in [10, 11, 12, 1, 2, 3] }}"
    then:
      - stop: "Outside the heating season: AC unit is left alone."

  # A manual mode holds until occupancy changes or the heating season starts.
  - if:
      - condition: template
        value_template: "{{ not is_state(climate_entity, 'heat') }}"
      - condition: template
        value_template: >-
          {{ not (trigger.id == 'occupancy_change' or
                  (trigger.id == 'season_start' and now().month == 10 and
                   now().day == 1)) }}
    then:
      - stop:
          "Manual override holds until occupancy changes or the heating season
          starts."

  - if:
      - condition: template
        value_template: "{{ not is_state(climate_entity, 'heat') }}"
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input climate_entity
        data:
          hvac_mode: heat

  # Occupancy changes only release the override. The setpoint steps on the 15-minute run.
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'occupancy_change' }}"
    then:
      - stop: "Occupancy changed: the setpoint steps on the next 15-minute run."

  # Without a fresh room reading, use the unit's own sensor at the unoccupied target, with no correction.
  - if:
      - condition: template
        value_template: >-
          {{ not is_number(states(temperature_sensor))
             or (now() -
          states[temperature_sensor].last_reported).total_seconds()
                > stale_after_seconds }}
    then:
      - if:
          - condition: template
            value_template:
              "{{ current_setpoint | float != fallback_setpoint | float }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ fallback_setpoint }}"
      - stop:
          "Room temperature is unavailable or stale: fell back to the unoccupied
          target."

  # Step the setpoint toward the target by 1 °C. Never turn the unit off.
  - variables:
      new_setpoint: >-
        {% set room = states(temperature_sensor) | float %} {% set step = 1 if
        room < target_temp | float - deadband
           else -1 if room > target_temp | float + deadband else 0 %}
        {{ [[current_setpoint | float + step, setpoint_min] | max, setpoint_max]
        | min }}

  - if:
      - condition: template
        value_template: "{{ new_setpoint | float != current_setpoint | float }}"
    then:
      - action: climate.set_temperature
        target:
          entity_id: !input climate_entity
        data:
          temperature: "{{ new_setpoint }}"

mode: restart
