blueprint:
  name: AC Heating
  description: >-
    While the AC heating switch is on, heat the room to its target temperature.
    Turning the switch on selects heat and sets the target, which is the
    occupied or unoccupied target temperature depending on the occupancy entity.
    Changes in occupancy apply the new target immediately. Every 15 minutes the
    unit is kept in heat mode. If the room is below target and the unit has
    reached its own setpoint, the setpoint steps up 1 °C, never more than 2 °C
    above target. If the room is above target, the setpoint steps down 1 °C.
    Turning the switch off selects off.
  domain: automation
  homeassistant:
    min_version: 2026.10.2
  input:
    climate_entity:
      name: AC indoor unit
      description: Climate entity of the AC indoor unit to control.
      selector:
        entity:
          filter:
            - domain: climate
    temperature_sensor:
      name: Room temperature sensor
      description: Room temperature used to decide the setpoint.
      selector:
        entity:
          filter:
            - domain: sensor
    occupancy_entity:
      name: Occupancy entity
      description: On while the room is occupied.
      selector:
        entity:
          filter:
            - domain:
                - input_boolean
                - binary_sensor
    heating_switch:
      name: AC heating switch
      description:
        On while the room is heated. Turning it off selects off on the AC indoor
        unit.
      selector:
        entity:
          filter:
            - domain: input_boolean
    unoccupied_target_temp:
      name: Unoccupied target temperature
      description: Target temperature while the room is unoccupied.
      default: 17
      selector:
        number:
          # The Toshiba integration rejects heat setpoints below 17 °C.
          min: 17
          max: 19
          step: 0.5
          unit_of_measurement: °C
    occupied_target_temp:
      name: Occupied target temperature
      description: Target temperature while the room is occupied.
      default: 22
      selector:
        number:
          min: 19
          max: 23
          step: 0.5
          unit_of_measurement: °C

triggers:
  - trigger: state
    entity_id: !input heating_switch
    from: "off"
    to: "on"
    id: switch_on
  - trigger: state
    entity_id: !input heating_switch
    from: "on"
    to: "off"
    id: switch_off
  - trigger: state
    entity_id: !input occupancy_entity
    id: occupancy_changed
  - trigger: time_pattern
    minutes: "/15"
    id: periodic
  - trigger: homeassistant
    event: start
    id: periodic

actions:
  - variables:
      climate_entity: !input climate_entity
      temperature_sensor: !input temperature_sensor
      occupancy_entity: !input occupancy_entity
      heating_switch: !input heating_switch
      unoccupied_target_temp: !input unoccupied_target_temp
      occupied_target_temp: !input occupied_target_temp
      deadband: 0.5
      max_above_target: 2
      stale_after_seconds: 3600
      target_temp: >-
        {{ occupied_target_temp if is_state(occupancy_entity, 'on')
           else unoccupied_target_temp }}

  - if:
      - condition: trigger
        id: switch_off
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input climate_entity
        data:
          hvac_mode: "off"
      - stop: "AC heating switch is off: AC indoor unit selected off."

  # Periodic runs leave the AC indoor unit alone unless the switch is on.
  - if:
      - condition: template
        value_template: "{{ not is_state(heating_switch, 'on') }}"
    then:
      - stop: "AC heating switch is off: leaving the AC indoor unit alone."

  # Turning the switch on, or a change in occupancy, applies the target at once.
  - if:
      - condition: trigger
        id:
          - switch_on
          - occupancy_changed
    then:
      - action: climate.set_temperature
        target:
          entity_id: !input climate_entity
        data:
          hvac_mode: heat
          temperature: "{{ target_temp }}"
      - stop: "Applied the target temperature."

  # Periodic control keeps the unit in heat mode.
  - if:
      - condition: template
        value_template: "{{ not is_state(climate_entity, 'heat') }}"
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input climate_entity
        data:
          hvac_mode: heat

  # Without a fresh room reading, leave the setpoint unchanged.
  - if:
      - condition: template
        value_template: >-
          {{ not is_number(states(temperature_sensor))
             or (now() -
          states[temperature_sensor].last_reported).total_seconds() >
          stale_after_seconds }}
    then:
      - stop:
          "Room temperature is unavailable or stale: leaving the setpoint
          unchanged."

  # Step the setpoint by 1 °C toward target, never above target + max_above_target.
  # Raise it only once the unit has reached its own setpoint, so the unit is not
  # heating the room more without a higher setpoint.
  - variables:
      current_setpoint: >-
        {{ state_attr(climate_entity, 'temperature') | float
           if is_number(state_attr(climate_entity, 'temperature'))
           else target_temp | float }}

  - variables:
      new_setpoint: >-
        {% set room = states(temperature_sensor) | float %} {% set unit_temp =
        state_attr(climate_entity, 'current_temperature') %} {% set unit_reached
        = is_number(unit_temp)
           and unit_temp | float >= current_setpoint | float %}
        {% set step = 1 if room < target_temp | float - deadband and
        unit_reached
           else -1 if room > target_temp | float + deadband else 0 %}
        {{ [current_setpoint | float + step,
            target_temp | float + max_above_target] | min }}

  - if:
      - condition: template
        value_template: "{{ new_setpoint | float != current_setpoint | float }}"
    then:
      - action: climate.set_temperature
        target:
          entity_id: !input climate_entity
        data:
          temperature: "{{ new_setpoint }}"

mode: restart
