blueprint:
  name: AC Heating
  description: |
    Start heating by toggling the room heating switch to `on`
    or by manually setting HVAC mode to `heat`.

    This automation behaves as follows:

    - **When the room heating switch turns on:**
      switch HVAC mode to `heat` and set the target temperature (depending on occupancy).

    - **When the room heating switch turns off:**
      if HVAC mode is `heat`, set it to `off` (preserve other HVAC modes).

    - **When HVAC mode changes to anything other than `heat`:**
      toggle the room heating switch to `off`.

    - **When occupancy changes:**
      apply the new target temperature as set temperature.

    - **Every 15 minutes:**
      - If the room temperature is below target and AC's set temperature has been reached,
        increase the set temperature by 1 °C (but never more than 2 °C above the target temperature).
      - If the room temperature is above target, decrease the set temperature by 1 °C.
  domain: automation
  homeassistant:
    min_version: 2026.10.2
  input:
    climate_entity:
      name: AC indoor unit
      description: Climate entity of the AC indoor unit.
      selector:
        entity:
          filter:
            - domain: climate
    temperature_sensor:
      name: Room temperature sensor
      description: Room temperature used to decide the setpoint.
      selector:
        entity:
          filter:
            - domain: sensor
    occupancy_entity:
      name: Occupancy entity
      description: On while the room is occupied.
      selector:
        entity:
          filter:
            - domain:
                - input_boolean
                - binary_sensor
    heating_switch:
      name: AC heating switch
      description: Indicates whether or not the room should be heated.
      selector:
        entity:
          filter:
            - domain: input_boolean
    unoccupied_target_temp:
      name: Unoccupied target temperature
      description: Target temperature while the room is unoccupied.
      default: 17
      selector:
        number:
          # The Toshiba integration rejects heat setpoints below 17 °C.
          min: 17
          max: 19
          step: 0.5
          unit_of_measurement: °C
    occupied_target_temp:
      name: Occupied target temperature
      description: Target temperature while the room is occupied.
      default: 22
      selector:
        number:
          min: 19
          max: 23
          step: 0.5
          unit_of_measurement: °C

triggers:
  - trigger: state
    entity_id: !input heating_switch
    from: "off"
    to: "on"
    id: switch_on
  - trigger: state
    entity_id: !input heating_switch
    from: "on"
    to: "off"
    id: switch_off
  - trigger: state
    entity_id: !input occupancy_entity
    id: occupancy_changed
  - trigger: state
    entity_id: !input climate_entity
  - trigger: time_pattern
    minutes: "/15"
  - trigger: homeassistant
    event: start

actions:
  - variables:
      climate_entity: !input climate_entity
      temperature_sensor: !input temperature_sensor
      occupancy_entity: !input occupancy_entity
      heating_switch: !input heating_switch
      unoccupied_target_temp: !input unoccupied_target_temp
      occupied_target_temp: !input occupied_target_temp
      deadband: 0.5
      max_above_target: 2
      stale_after_seconds: 900
      target_temp: >-
        {{ occupied_target_temp if is_state(occupancy_entity, 'on')
           else unoccupied_target_temp }}

  - choose:
      # The unit is switched off only while it is still in heat mode.
      - conditions:
          - condition: trigger
            id: switch_off
        sequence:
          - if:
              - condition: state
                entity_id: !input climate_entity
                state: heat
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: !input climate_entity
                data:
                  hvac_mode: "off"
          - stop: "Heating switch was turned off: turn off AC."

      - conditions:
          - condition: template
            value_template: "{{ not is_state(heating_switch, 'on') }}"
        sequence:
          - stop: "Heating switch is off: leave the AC alone."

      - conditions:
          - condition: trigger
            id: switch_on
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: heat
              temperature: "{{ target_temp }}"
          - stop: "Heating switch turned on: turn on heat and set target temp."

      - conditions:
          - condition: trigger
            id: occupancy_changed
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ target_temp }}"
          - stop: "Occupancy has changed: new target temp set on the AC."

    # Periodic runs and mode changes: any mode other than heat ends heating.
    default:
      - if:
          - condition: template
            value_template: >-
              {{ not is_state(climate_entity, 'heat')
                 and not is_state(climate_entity, 'unavailable')
                 and not is_state(climate_entity, 'unknown') }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: !input heating_switch
          - stop: "AC left heat mode: heating switch turned off."

      # Without a fresh room reading, leave the setpoint unchanged.
      - if:
          - condition: template
            value_template: >-
              {{ not is_number(states(temperature_sensor))
                 or (now() -
              states[temperature_sensor].last_reported).total_seconds() >
              stale_after_seconds }}
        then:
          - stop:
              "Room temperature is unavailable or stale: leaving the setpoint
              unchanged."

      # Step the setpoint by 1 °C toward target, never above target + max_above_target.
      # Raise it only once the unit has reached its own setpoint, so the unit is not
      # heating the room more without a higher setpoint.
      - variables:
          current_setpoint: >-
            {{ state_attr(climate_entity, 'temperature') | float
               if is_number(state_attr(climate_entity, 'temperature'))
               else target_temp | float }}

      - variables:
          new_setpoint: >-
            {% set room = states(temperature_sensor) | float %} {% set unit_temp
            = state_attr(climate_entity, 'current_temperature') %} {% set
            unit_reached = is_number(unit_temp)
               and unit_temp | float >= current_setpoint | float %}
            {% set step = 1 if room < target_temp | float - deadband and
            unit_reached
               else -1 if room > target_temp | float + deadband else 0 %}
            {{ [current_setpoint | float + step,
                target_temp | float + max_above_target] | min }}

      - if:
          - condition: template
            value_template:
              "{{ new_setpoint | float != current_setpoint | float }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ new_setpoint }}"

mode: restart
