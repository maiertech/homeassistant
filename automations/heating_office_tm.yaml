alias: Heating (Office TM)

description: >-
  Instance of the AC unit heating blueprint for the office Toshiba.

use_blueprint:
  path: ac_unit_heating.yaml
  input:
    climate_entity: climate.office_tm_toshiba
    temperature_sensor: sensor.office_tm_avg_temperature
    occupancy_entity: input_boolean.office_tm_occupied
    unoccupied_target_temp: 16
    occupied_target_temp: 22
