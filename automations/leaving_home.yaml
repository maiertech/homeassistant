alias: Leaving home

description:
  Send a push notification to the family when an iPhone has left home. FritzBox
  gives a grace period of 180 seconds before triggering.

triggers:
  - trigger: state
    entity_id:
      - device_tracker.iphone_tm
      - device_tracker.iphone_ck
    to: "not_home"

conditions: []

actions:
  - variables:
      names:
        device_tracker.iphone_tm: Thilo
        device_tracker.iphone_ck: Cindy
      name: "{{ names.get(trigger.entity_id, 'Someone') }}"
      title: Leaving home 👋
      message: "{{ name }} has left home."
  - action: notify.send_message
    target:
      entity_id: notify.family
    data:
      title: "{{ title }}"
      message: "{{ message }}"

mode: parallel
