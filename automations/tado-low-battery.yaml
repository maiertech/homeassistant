alias: Low battery (Tado)

description:
  Send a push and persistent notification when the batteries of a Tado
  thermostat are low.

triggers:
  - trigger: state
    entity_id:
      - binary_sensor.living_room_tado_battery
      - binary_sensor.office_ck_tado_battery
      - binary_sensor.hal_tado_battery
      - binary_sensor.bathroom_downstairs_tado_battery
      - binary_sensor.parents_tado_battery
      - binary_sensor.office_tm_tado_battery
      - binary_sensor.alex_tado_battery
    to:
      - "on"

conditions: []

actions:
  - variables:
      title: Low battery alert 🪫
      message: Replace batteries in Tado {{ area_name(trigger.entity_id) }}.
  - action: persistent_notification.create
    data:
      title: "{{ title }}"
      message: "{{ message }}"
      notification_id: low_battery_{{ trigger.entity_id }}
  - action: notify.send_message
    target:
      entity_id: notify.family
    data:
      title: "{{ title }}"
      message: "{{ message }}"

mode: parallel
